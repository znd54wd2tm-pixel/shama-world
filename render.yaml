services:
  - type: web
    name: shama-world
    runtime: python
    # Persistent disks and an always-on process are required for SQLite data.
    # Do not deploy this economy on a sleeping free instance.
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn routes:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBAPP_URL
        value: https://shama-world.onrender.com/
      - key: DATABASE_PATH
        value: /var/data/shama_world.db
      # Supabase is a private cloud recovery copy. The server role key must
      # be set only in Render's secret environment-variable UI.
      - key: SUPABASE_URL
        value: https://ekmmgelhdzovbjtojqkw.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
    disk:
      name: shama-world-data
      mountPath: /var/data
      sizeGB: 1
