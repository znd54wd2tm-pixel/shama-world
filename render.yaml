services:
  - type: web
    name: shama-world
    runtime: python
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: pip install -r requirements.txt && python scripts/check_deploy.py
    startCommand: python -m uvicorn routes:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBAPP_URL
        value: https://shama-world.onrender.com/
      - key: DATABASE_PATH
        value: /var/data/shama_world.db
      - key: PYTHONUNBUFFERED
        value: "1"
    disk:
      name: shama-world-data
      mountPath: /var/data
      sizeGB: 1
