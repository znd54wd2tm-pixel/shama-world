services:
  - type: web
    name: shama-world
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.routes:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBAPP_URL
        value: https://shama-world.onrender.com/
      - key: DATABASE_PATH
        value: shama_world.db
