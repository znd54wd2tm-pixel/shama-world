services:
  - type: web
    name: shama-world
    runtime: python
    # Persistent disks and an always-on process are required for SQLite data.
    # Do not deploy this economy on a sleeping free instance.
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn routes:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBAPP_URL
        value: https://shama-world.onrender.com/
      - key: DATABASE_PATH
        value: /var/data/shama_world.db
    disk:
      name: shama-world-data
      mountPath: /var/data
      sizeGB: 1
